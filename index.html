<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=0.9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000033">

    <title>ferruea Music</title>
    
    <link rel="shortcut icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/estilo.css">

</head>
<body>

    <button class="boton" onclick="invertir();">
        <img src="images/invertir.png" height="25" width="25">
    </button>

    <div class="particles" id="particles-js"></div>

    <div class="phone">
        <div class="phone2">
            <audio id="player" ontimeupdate="updateProgress();">
                <source id="source">Audio no soportado
            </audio>

            <div id="controls">
                <div class="timer" id="timer">&nbsp;</div>
                
                <div class="volumen">
                    <i class="fas fa-volume-down"></i>
                    <input type="range" name="volumen" id="volumen" min="0" max="1" step="0.01" value="0.75">
                    <i class="fas fa-volume-up"></i>
                </div>

                <i class="fas fa-backward fa-5x" onclick="prevMusic();"></i>
                <i class="far fa-play-circle fa-5x" onclick="togglePlay();" id="iconPlay"></i>
                <i class="fas fa-forward fa-5x" onclick="nextMusic();"></i>

                <br><b><a>Reproduciendo:</a></b>

                <br><span id="currentPlay"></span><br>
                <progress id="progress" value="0" max="100"></progress>

                <h3>Mi música</h3>

                <input id="searchTerm" type="text" onkeyup="doSearch(); replaceName(this)" placeholder="Buscar música">

                <div id="playList"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a target="_blank" href="https://instagram.com/ferruea">design by ferruea</a>
    </div>
    
    <div class="music">
        <a target="_blank" href="music">music</a>
    </div>

    <script src="js/all.js" defer></script>
    <script src="js/invertir.js" defer></script>
    <script src="js/particles.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/buscar.js" defer></script>
    <script src="js/music.js" defer></script>

</body>
</html>
