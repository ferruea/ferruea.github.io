<!DOCTYPE html>
<html lang="es">
<head>
    
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=0.9, maximum-scale=0.9, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000033">

    <title>ferruea Music</title>
    
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/estilo.css">

</head>
<body>
    
    <div class="particles" id="particles-js"></div>
    
    <div class="phone">
        <div class="phone2">
            <audio id="player" ontimeupdate="updateProgress();">
                <source id="source">Audio no soportado
            </audio>

            <div id="controls">
                <div class="timer" id="timer">&nbsp;</div>
                
                <div class="volumen">
                    <i class="fas fa-volume-down" onclick="ajustarVolumen(-0.05)"></i>
                    <input type="range" name="volumen" id="volumen" min="0" max="1" step="0.01" value="0.75">
                    <i class="fas fa-volume-up" onclick="ajustarVolumen(0.05)"></i>
                </div>

                <i class="fas fa-backward fa-5x" onclick="prevMusic();"></i>
                <i class="far fa-play-circle fa-5x" onclick="togglePlay();" id="iconPlay"></i>
                <i class="fas fa-forward fa-5x" onclick="nextMusic();"></i>

                <br><b><a>Reproduciendo:</a></b>

                <br><span id="currentPlay"></span><br>
                <progress id="progress" value="0" max="100"></progress>

                <div class="table-container"><table><thead>
                    <tr>
                        <th class="col1">
                            <i class="far fa-reset-1 fa-2x" onclick="aleatorio();" id="aleatorio"></i>
                        </th>
                        <th class="col2">
                            <h3>Mi música</h3>
                            <input id="searchTerm" type="text" onkeyup="doSearch(); replaceName(this)" placeholder="Buscar música">
                        </th>
                        <th class="col3">
                            <i class="far fa-repeat-off fa-2x" onclick="toggleRepeat();" id="iconRepeat"></i>
                        </th>
                    </tr>
                </thead></table></div>

                <div id="playList"></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <a target="_blank" href="https://instagram.com/ferruea">design by ferruea</a>
    </div>
    
    <div class="music">
        <a target="_blank" href="music">music</a>
    </div>

    <div class="los40es">
        <a href="#" onclick="playLos40(); return false;">los40es</a>
    </div>

    <button class="boton" onclick="invertir();">
        <img src="images/invertir.png" height="25" width="25">
    </button>

    <script src="js/particles.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/all.js" defer></script>
    <script src="js/music.js" defer></script>
    <script src="js/buscar.js" defer></script>
    <script src="js/invertir.js" defer></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            function isMobileDevice() {
                return window.matchMedia("(max-width: 1000px)").matches;
            }
            if (isMobileDevice()) {
                if (!sessionStorage.getItem('reloaded')) {
                    sessionStorage.setItem('reloaded', 'true');
                    location.reload(true);
                } else {
                    sessionStorage.removeItem('reloaded');
                }
            }
        });
    </script>

    <script>
    function playLos40() {
        los40es = true; // modo radio
        let player = document.getElementById("player");
        let source = document.getElementById("source");
        source.src = "https://19993.live.streamtheworld.com/LOS40_SC";
        player.load();
        player.play();
        classIconPlay()
        toggleIcon()
        document.getElementById("currentPlay").innerText = "los40es";
    }
</script>

</body>
</html>
